[project]
name = "omim2obo"
version = "0.1.0"
description = "Transforms OMIM's downloads into OWL and TSV artefacts for the Mondo Disease Ontology"
readme = "README.md"
# The release build runs inside obolibrary/odkfull, which ships Python 3.12.
requires-python = ">=3.12"
dependencies = [
    "sssom>=0.4.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "legacy",                       # frozen until it is deleted
    "analyses", "dev", "*.ipynb", "*.md",
    "src/omim2obo/romanplus.py",    # third-party code, kept as it came
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Carried over from the legacy pipeline. Their long comment lines are left as their authors wrote
# them, and titles.py keeps two things on purpose; B034 is one, marked QUIRK there.
"src/omim2obo/titles.py" = ["E501", "B006", "B034"]
"src/omim2obo/predicates.py" = ["E501"]
"src/omim2obo/entry_prefix.py" = ["E501"]
